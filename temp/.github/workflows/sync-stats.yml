name: Sync GitHub Stats

on:
  schedule:
    # 每天 UTC 0:00（北京时间 8:00）自动运行
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'scripts/fetch_github.py'

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests --break-system-packages

      - name: Fetch GitHub stats
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
        run: python scripts/fetch_github.py

      - name: Verify output
        run: |
          if [ -f src/data/github_stats.json ]; then
            echo "Stats file generated:"
            cat src/data/github_stats.json
          else
            echo "::error::Stats file not found"
            exit 1
          fi

      - name: Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/github_stats.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update github stats [skip ci]"
            git push
          fi
